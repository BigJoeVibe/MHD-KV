<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#0a0e1a"/>

  <!-- Bus body -->
  <rect x="3" y="9" width="26" height="14" rx="2.5" fill="#4d7df7"/>

  <!-- Roof line / top detail -->
  <rect x="5" y="9" width="22" height="3" rx="1.5" fill="#3a6ae0"/>

  <!-- Windows -->
  <rect x="6"  y="13" width="5" height="4.5" rx="1" fill="#0a0e1a" opacity="0.85"/>
  <rect x="13.5" y="13" width="5" height="4.5" rx="1" fill="#0a0e1a" opacity="0.85"/>
  <rect x="21" y="13" width="5" height="4.5" rx="1" fill="#0a0e1a" opacity="0.85"/>

  <!-- Wheel arches -->
  <rect x="3" y="20" width="26" height="3" rx="0" fill="#3a6ae0"/>

  <!-- Wheels -->
  <circle cx="9.5" cy="24" r="3.5" fill="#1a1f30"/>
  <circle cx="9.5" cy="24" r="1.8" fill="#4d7df7"/>
  <circle cx="22.5" cy="24" r="3.5" fill="#1a1f30"/>
  <circle cx="22.5" cy="24" r="1.8" fill="#4d7df7"/>

  <!-- Door line -->
  <line x1="11.5" y1="13" x2="11.5" y2="17.5" stroke="#3a6ae0" stroke-width="0.8"/>
</svg>
